<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PAL-KOV &amp; A.H.METAL – Dispečing</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#F2F4F7;color:#0B1F45}
header{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#eef2f7 100%);color:#0B1F45;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:5px solid #1E4FA3}
header::before{content:"";position:absolute;right:-40px;top:0;bottom:0;width:520px;z-index:0;pointer-events:none;
 background:linear-gradient(115deg,transparent 0 18%,#C9CFD8 18% 24%,transparent 24% 30%,#1E90E0 30% 40%,transparent 40% 45%,#1E4FA3 45% 62%,transparent 62% 66%,#1E90E0 66% 74%,#A9B1BC 74% 78%,#1E4FA3 78%);
 clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,30% 50%)}
header>*{position:relative;z-index:1}
.logo{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.logo .c{font-size:26px;font-weight:900;font-style:italic;letter-spacing:.5px;color:#0B1F45;line-height:1.1;border-bottom:3px solid #1E90E0}
.logo .meta{font-size:12px;color:#3A4A66;border-left:2px solid #C9CFD8;padding-left:12px}.logo .meta b{font-style:italic;font-size:14px;color:#1E4FA3}
.logo .sec{font-size:15px;font-weight:700;color:#0B1F45;background:#E6EEF9;border:1px solid #BFD0EA;border-radius:6px;padding:2px 8px}
.who{color:#fff;font-weight:700;background:#0B1F45;border-radius:6px;padding:4px 10px}.logo .c{white-space:nowrap}.logo img.lg{height:58px;width:58px;flex:none}@media(max-width:600px){.logo img.lg{height:44px;width:44px}}
header button{background:#fff;color:#0B1F45;border:2px solid #0B1F45;font-weight:700}header button:hover{background:#E6EEF9}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #9AA5B4;background:#fff;color:#0B1F45;padding:6px 12px}
button.pri{background:#1E4FA3;color:#fff;border-color:#1E4FA3}button.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
input,textarea,select{font:inherit;padding:6px 8px;border:1px solid #bbb;border-radius:6px;width:100%}
.wrap{padding:16px}.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px #0002;margin-bottom:14px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.s-nova{background:#e0e0e0}.s-prebieha{background:#D6E9FB;color:#0D4C8C}.s-hotovo{background:#d1f2d6;color:#1b5e20}
.lst{padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;cursor:pointer}.lst.sel{border-color:#1E4FA3;border-width:2px;background:#EAF2FC}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px;vertical-align:top;font-size:14px}th{background:#EEF2F7;text-align:left}
.paper th.h{background:linear-gradient(135deg,#1E4FA3,#1E90E0);color:#fff}#map{height:300px;border-radius:8px;background:#dde}
.chat{max-height:220px;overflow:auto;background:#fafafa;border:1px solid #ddd;border-radius:6px;padding:6px;margin:6px 0}
.msg{margin:4px 0;padding:6px 8px;border-radius:8px;background:#fff;border:1px solid #e5e5e5}.msg.d{background:#e8f0fe}.msg small{color:#666}
.msg img{max-width:160px;display:block;margin-top:4px;border-radius:6px}
.rules{color:#B71C1C;font-weight:700;border-left:5px solid #C62828;background:#FFF1F1;padding:8px 12px;border-radius:6px}
/* login */
.login{max-width:460px;margin:40px auto}.login .u{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0;cursor:pointer;font-size:18px}
/* driver - big */
.drv{font-size:24px}.drv .wrap{padding:12px}.drv h2{font-size:30px;margin:6px 0}
.drv button{font-size:26px;padding:18px;border-radius:14px;width:100%;margin:6px 0;font-weight:700}
.drv input,.drv textarea{font-size:26px;padding:14px}.drv label{display:block;font-weight:700;margin-top:12px}
.drv .rules{font-size:22px;background:#ffebee;border:3px solid #c62828;border-radius:12px;padding:10px 14px}
.drv .badge{font-size:22px;padding:4px 14px}.drv .tnum{font-size:34px;font-weight:800;color:#1E4FA3}
.drv .logo .meta{display:none}.drv header button{font-size:20px;width:auto;padding:8px 14px;margin:0}
.drv .msg{font-size:22px}.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#printArea{display:none}
.pslip{font-family:Arial,sans-serif;color:#000;page-break-after:always;break-after:page}.pslip:last-child{page-break-after:auto;break-after:auto}
.pslip .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1E4FA3;margin-bottom:6px}.pslip .ph b{font-style:italic;font-size:15pt;color:#0B1F45}.pslip .ph span{font-size:18pt;font-weight:900;letter-spacing:1px}
.pslip table{width:100%;border-collapse:collapse;margin-bottom:5px}.pslip td,.pslip th{border:1px solid #000;padding:3px 5px;font-size:9.5pt;vertical-align:top;text-align:left;background:none}.pslip th{font-weight:700;font-size:8.5pt}.pslip .num{width:52px;text-align:center}.pslip .num big{font-size:20pt}.pslip .tx{height:34px}.pslip .val{font-size:11pt;font-weight:700;height:20px}
.pslip .pr{color:#c00;font-weight:700;font-size:10pt;margin-top:6px}.pslip .pp img{height:120px;margin:3px;border:1px solid #999}.pslip .nb{height:40px}
@page{size:A4;margin:10mm}
@media print{body.printing #app,body.printing #toast,body.printing #nbanner,body.printing #sndb{display:none!important}body.printing #printArea{display:block}header,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){header{padding:8px 12px;gap:8px}header::before{width:110px}.logo .meta,.logo .sec{display:none}.logo .c{font-size:21px}.logo{flex:1 1 100%}.who{font-size:18px;margin-right:auto}header button{padding:6px 10px}}
</style></head><body><div id="app"></div>
<script>
const RULES=['Pri nákupe alebo predaji treba skontrolovať údaje na VL','Pri predaji FK sa treba vážiť prázdny aj plný!!!','Pri neopakovanom dovoze sa treba o vykládke poradiť!!!','Po príchode zo zvozu treba úvodnú váhu robiť komplet!!!','Nezabudni dopísať čísla kontajnerov!!!'];
const ST={nova:'Nová',prebieha:'Prebieha',hotovo:'Hotovo'};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const now=()=>new Date().toTimeString().slice(0,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SB_URL='https://yrrjufilzsepoqoitwed.supabase.co',SB_KEY='sb_publishable_IlXIXhi7tw-2FcN8eQQCjA_2BlV1pOS';
const sb=supabase.createClient(SB_URL,SB_KEY);
const DEMO=[{name:'Radko Krupička',email:'radko.krupicka@pal-kov.local',pw:'dispecer',role:'Dispečer'},{name:'Vlado Češko',email:'vlado.cesko@pal-kov.local',pw:'vodic',role:'Vodič'},{name:'Daniel Gago',email:'daniel.gago@pal-kov.local',pw:'vodic',role:'Vodič'},{name:'Ivan Zigo',email:'ivan.zigo@pal-kov.local',pw:'vodic',role:'Vodič'}];
let db={users:[],lists:[],pos:{}};
let S=JSON.parse(sessionStorage.getItem('aha_s')||'{}');S.view=S.view||'login';
const go=v=>{S.view=v;sessionStorage.setItem('aha_s',JSON.stringify(S));render()};
const user=id=>db.users.find(u=>u.id===id)||{name:'?'};
const app=document.getElementById('app');
const hm=ts=>ts?new Date(ts).toTimeString().slice(0,5):'';
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function toast(m,err){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 18px;border-radius:10px;color:#fff;font-weight:700;z-index:9999;font-size:18px';document.body.appendChild(t)}t.style.background=err?'#B71C1C':'#1E4FA3';t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
const chk=r=>{if(r&&r.error){console.error(r.error);toast('Chyba: '+r.error.message,1)}return r};
function render(){document.body.classList.toggle('drv',S.view==='vodic');({login:vLogin,dispecer:vDisp,vodic:vDrv,report:vRep,archiv:vArch,drivers:vDrivers,loading:()=>{app.innerHTML=`<header>${logo('…')}</header><div class="wrap"><div class="card"><h2>Načítavam…</h2></div></div>`}})[S.view]()}
let pend=false;function safeRender(){const a=document.activeElement;if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='file'){if(!pend){pend=true;a.addEventListener('blur',()=>{pend=false;setTimeout(render,50)},{once:true})}return}render()}
async function load(force){if(S.view==='archiv')return loadArch();const d=S.view==='vodic'?(S.ddate||today()):(S.date||today());
 const [u,s,p,z]=await Promise.all([sb.from('users').select('*'),sb.from('slips').select('*,tasks(*,messages(*))').eq('date',d),sb.from('positions').select('*'),sb.from('slips').select('spz').neq('spz','').order('id',{ascending:false}).limit(500)]);
 db.spzs=[...new Set((z.data||[]).map(x=>x.spz.trim().toUpperCase()))];
 if(chk(u).error||chk(s).error)return;
 db.users=u.data.map(x=>({id:x.id,name:x.name,role:x.role,spz:x.spz})).sort((a,b)=>a.role.localeCompare(b.role)||a.name.localeCompare(b.name));
 db.lists=s.data.sort((a,b)=>a.id-b.id).map(l=>({id:String(l.id),date:l.date,driverId:l.driver_id,spz:l.spz||'',note:l.note||'',tasks:l.tasks.sort((a,b)=>a.ord-b.ord).map(t=>({id:t.id,ord:t.ord,text:t.text||'',weight:t.weight||'',saleNote:t.sale_note||'',placed:t.placed||'',removed:t.removed||'',from:t.time_from||'',to:t.time_to||'',status:t.status,msgs:t.messages.sort((a,b)=>a.id-b.id).map(m=>({who:m.author_id,t:hm(m.created_at),text:m.text,photo:m.photo_url,audio:m.audio_url,gps:m.lat!=null?{lat:m.lat,lng:m.lng}:null}))}))}));
 db.pos={};(p.data||[]).forEach(x=>db.pos[x.driver_id]={lat:x.lat,lng:x.lng,t:hm(x.ts)});
 if(S.view!=='login'&&S.view!=='loading')(force?render:safeRender)()}
let ch,tm;const sched=()=>{clearTimeout(tm);tm=setTimeout(load,250)};
function subscribe(){if(ch)return;ch=sb.channel('aha-all');['slips','tasks','messages','positions'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{onEvent(t,p);sched()}));ch.subscribe(st=>{S.rt=st;if(st==='SUBSCRIBED')sched()})}
async function afterLogin(uid,view){S.uid=uid;S.view='loading';render();await load();const u=user(uid);subscribe();go(view&&view!=='login'&&view!=='loading'?(u.role==='vodic'?'vodic':view):(u.role==='dispecer'?'dispecer':'vodic'))}
async function logout(){if(ch){sb.removeChannel(ch);ch=null}await sb.auth.signOut();S.uid=null;go('login')}
function logo(sec){return`<div class="logo"><img class="lg" src="logo.svg" alt=""><div class="c">PAL-KOV &amp; A.H.METAL</div><div class="meta"><b>Since 1994</b><br>www.kovosrotdca.sk</div><span class="sec">${sec}</span></div>`}
function hdr(extra=''){const u=user(S.uid);return`<header>${logo({vodic:'Vodič',report:'Prehľad',archiv:'Archív',drivers:'Šoféri'}[S.view]||'Dispečing')}${extra}<span class="who">${esc(u.name)}</span><button onclick="logout()">Odhlásiť</button></header>${sndBtn()}`}
async function doLogin(e){e.preventDefault();const n=norm(ln.value);const d=DEMO.find(d=>norm(d.name)===n||norm(d.name.split(' ')[0])===n);
 const email=d?d.email:slug(ln.value)+'@pal-kov.local';lerr.textContent='Prihlasujem…';
 const {data,error}=await sb.auth.signInWithPassword({email,password:lp.value+'-pk'});
 if(error){lerr.textContent='Nesprávne meno alebo heslo.';return}afterLogin(data.user.id)}
function vLogin(){app.innerHTML=`<header>${logo('Prihlásenie')}</header><div class="login card"><h2>Prihlásenie</h2>
<form onsubmit="doLogin(event)"><label>Meno<input id="ln" autocomplete="username" style="font-size:20px;padding:10px;margin:4px 0 10px"></label>
<label>Heslo<input id="lp" type="password" autocomplete="current-password" style="font-size:20px;padding:10px;margin:4px 0 10px"></label>
<div id="lerr" style="color:#B71C1C;font-weight:700"></div><button class="pri" style="width:100%;font-size:20px;padding:12px">Prihlásiť</button></form>
<h3 style="margin-top:22px">Demo prístupy</h3><table><tr><th>Meno</th><th>Heslo</th><th>Rola</th></tr>${DEMO.map(u=>`<tr style="cursor:pointer" onclick="ln.value='${esc(u.name)}';lp.value='${u.pw}'"><td>${esc(u.name)}</td><td><code>${u.pw}</code></td><td>${u.role}</td></tr>`).join('')}</table>
<p><small>Klik na riadok vyplní údaje. Dáta sú zdieľané medzi zariadeniami a menia sa v reálnom čase.</small></p></div>`}
// ---------- DISPEČER
function vDisp(){if(!S.date)S.date=today();const ls=db.lists.filter(l=>l.date===S.date);if(!ls.find(l=>l.id===S.sel))S.sel=ls[0]?.id;
 const L=db.lists.find(l=>l.id===S.sel);
 app.innerHTML=hdr(`<button onclick="go('report')">Denný prehľad</button><button onclick="go('archiv');load()">Archív / export</button><button onclick="go('drivers')">Šoféri</button>`)+`<div class="wrap grid"><div><div class="card"><div class="row"><button onclick="shiftDay(-1)">◀</button><input id="dday" type="date" value="${S.date}" onchange="S.date=this.value;load(1)" style="width:auto"><button onclick="shiftDay(1)">▶</button><button onclick="S.date=today();load(1)">Dnes</button></div><div class="row" style="margin-top:8px"><button class="pri" onclick="newList()">+ Nový lístok na ${fmtD(S.date)}</button></div><div class="row noprint" style="margin-top:8px"><button onclick="printSlips(db.lists.filter(l=>l.date===S.date).map(l=>l.id))">🖨 Tlačiť všetky lístky dňa</button><label class="row" style="gap:4px"><input type="checkbox" style="width:auto" ${S.pph?'checked':''} onchange="S.pph=this.checked"> s fotkami</label></div><h3>Lístky (${ls.length}) <small title="Realtime" style="color:${S.rt==='SUBSCRIBED'?'#2e7d32':'#999'}">● live</small></h3>${ls.map(l=>{const d=l.tasks.filter(t=>t.status==='hotovo').length;return`<div class="lst ${l.id===S.sel?'sel':''}" onclick="S.sel='${l.id}';render()"><b>${esc(user(l.driverId).name)}</b> · ${esc(l.spz)}<br><small>${d}/${l.tasks.length} hotových</small> ${l.tasks.map(t=>`<span class="badge s-${t.status}">${ST[t.status][0]}</span>`).join(' ')}</div>`}).join('')||'<i>Žiadne lístky</i>'}</div><div class="card"><h3>Poloha vodičov</h3><div id="map"></div><small>${db.users.filter(u=>u.role==='vodic').map(u=>`${esc(u.name)}: ${db.pos[u.id]?db.pos[u.id].t:'–'}`).join(' · ')}</small></div></div><div>${L?paper(L):'<div class="card">Vyberte alebo vytvorte lístok.</div>'}</div></div>`;
 initMap();}
function paper(L){const drv=db.users.filter(u=>u.role==='vodic');
 return`<div class="card paper"><div class="row" style="justify-content:space-between"><h2 style="margin:0">ZADÁVACÍ LÍSTOK</h2><div class="row noprint"><button onclick="printSlips(['${L.id}'])">🖨 Tlačiť lístok</button><button onclick="delList('${L.id}')">Zmazať</button></div></div>
 <table style="margin:10px 0"><tr><th>Dátum</th><td><input type="date" value="${L.date}" onchange="upd('${L.id}','date',this.value)"></td><th>ŠPZ</th><td><input list="spzl" placeholder="ŠPZ vozidla" value="${esc(L.spz)}" onchange="upd('${L.id}','spz',this.value.toUpperCase())"><datalist id="spzl">${(db.spzs||[]).map(z=>`<option value="${esc(z)}">`).join('')}</datalist></td><th>Meno vodiča</th><td><select onchange="upd('${L.id}','driverId',this.value)">${drv.map(u=>`<option value="${u.id}" ${u.id===L.driverId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></td></tr></table>
 ${L.tasks.map((t,i)=>task(L,t,i)).join('')}
 ${L.tasks.length<5?`<button class="noprint" onclick="addTask('${L.id}')">+ Pridať úlohu (${L.tasks.length}/5)</button>`:''}
 <p><b>Poznámky:</b><textarea rows="2" onchange="upd('${L.id}','note',this.value)">${esc(L.note)}</textarea></p>
 <div class="rules">${RULES.map(r=>`<div>${r}</div>`).join('')}</div></div>`}
function task(L,t,i){const f=(k,ph='')=>`<input value="${esc(t[k])}" placeholder="${ph}" onchange="updT('${L.id}',${i},'${k}',this.value)">`;
 return`<table style="margin-bottom:10px"><tr><th class="h" rowspan="2" style="width:70px">Č. úlohy<br><span style="font-size:26px">${i+1}</span></th><th colspan="2">Text pre zadanie úlohy <span class="badge s-${t.status}">${ST[t.status]}</span>
 <select class="noprint" style="width:auto;float:right" onchange="updT('${L.id}',${i},'status',this.value)">${Object.keys(ST).map(k=>`<option value="${k}" ${k===t.status?'selected':''}>${ST[k]}</option>`).join('')}</select></th><th>Údaje o kontajneri</th><th>Vykonaná</th></tr>
 <tr><td colspan="2"><textarea rows="2" onchange="updT('${L.id}',${i},'text',this.value)">${esc(t.text)}</textarea><div class="row" style="margin-top:4px"><div style="flex:1"><small>Nakúpená hmotnosť</small>${f('weight','kg')}</div><div style="flex:2"><small>Poznámky o predaji</small>${f('saleNote')}</div></div></td>
 <td style="width:150px"><small>Číslo pristav.</small>${f('placed')}<small>Číslo odvez.</small>${f('removed')}</td><td style="width:120px"><small>v čase od</small><input type="time" value="${t.from}" onchange="updT('${L.id}',${i},'from',this.value)"><small>v čase do</small><input type="time" value="${t.to}" onchange="updT('${L.id}',${i},'to',this.value)"></td></tr>
 <tr class="noprint"><td colspan="5"><details ${t.msgs.length?'open':''}><summary>Chat / poznámky k úlohe (${t.msgs.length})</summary>${chat(t)}<div class="row"><input id="m${i}" placeholder="Správa pre vodiča…" style="flex:1"><label class="row" style="cursor:pointer">📷<input type="file" accept="image/*" style="display:none" onchange="photo(this,'${L.id}',${i})"></label><button class="pri" onclick="send('${L.id}',${i},document.getElementById('m${i}').value)">Odoslať</button></div></details></td></tr></table>`}
function chat(t){return`<div class="chat">${t.msgs.map(m=>`<div class="msg ${user(m.who).role==='dispecer'?'d':''}"><small>${esc(user(m.who).name)} · ${m.t}</small><br>${esc(m.text||'')}${m.photo?`<img src="${m.photo}">`:''}${m.audio?`<audio controls src="${m.audio}"></audio>`:''}${m.gps?`<a target="_blank" href="https://www.openstreetmap.org/?mlat=${m.gps.lat}&mlon=${m.gps.lng}#map=16/${m.gps.lat}/${m.gps.lng}">📍 poloha</a>`:''}</div>`).join('')||'<small>Zatiaľ bez správ</small>'}</div>`}
const getL=id=>db.lists.find(l=>l.id===id);
const TCOL={text:'text',weight:'weight',saleNote:'sale_note',placed:'placed',removed:'removed',from:'time_from',to:'time_to',status:'status'};
async function upd(id,k,v){const L=getL(id);const o={};if(k==='driverId')o.driver_id=v;else o[k]=v;L[k]=v;
 chk(await sb.from('slips').update(o).eq('id',id));if(k==='date')S.date=v;load()}
async function updT(id,i,k,v){const t=getL(id).tasks[i];t[k]=v;safeRender();chk(await sb.from('tasks').update({[TCOL[k]]:v,updated_at:new Date().toISOString()}).eq('id',t.id))}
async function setT(id,i,o){const t=getL(id).tasks[i];const r={updated_at:new Date().toISOString()};for(const k in o){t[k]=o[k];r[TCOL[k]]=o[k]}render();chk(await sb.from('tasks').update(r).eq('id',t.id))}
async function addTask(id){const L=getL(id);chk(await sb.from('tasks').insert({slip_id:+id,ord:L.tasks.length+1}));load()}

 ${Object.entries(g).map(([id,ls])=>`<h3>${esc(user(id).name)} <small>(${ls.length} lístkov)</small></h3><table><tr>${AH.filter((_,i)=>i!==1).map(h=>`<th>${h}</th>`).join('')}</tr>${archRows(ls).map(r=>`<tr>${r.filter((_,i)=>i!==1).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`).join('')||'<i>Nič sa nenašlo</i>'}</div>
 <div class="card" style="max-width:640px"><h2>Uchovávanie dát (retencia)</h2><p>Odporúčanie: záznamy (lístky, úlohy, správy) uchovávať <b>24 mesiacov</b>, fotky a hlasové správy <b>12 mesiacov</b>. Automatické mazanie je predvolene <b>vypnuté</b> – nič sa nemaže.</p>
 <div class="row"><label>Záznamy (mesiace) <input id="rdb" type="number" min="1" value="${ret.db_months}" style="width:90px"></label><label>Fotky/zvuk (mesiace) <input id="rmd" type="number" min="1" value="${ret.media_months}" style="width:90px"></label>
 <label class="row" style="gap:4px"><input id="rad" type="checkbox" style="width:auto" ${ret.auto_delete?'checked':''}> automatické mazanie</label><button class="pri" onclick="saveRet()">Uložiť</button></div>
 <p><small>Pozn.: v tejto verzii sa nastavenie len ukladá; automatická úloha na mazanie zatiaľ nie je spustená.</small></p></div></div>`}
async function saveRet(){ret={db_months:+rdb.value||24,media_months:+rmd.value||12,auto_delete:rad.checked};if(!chk(await sb.from('settings').upsert({key:'retention',value:ret,updated_at:new Date().toISOString()})).error)toast('Nastavenie uložené')}
function archCsv(){const g=byDrv();if(!Object.keys(g).length)return toast('Žiadne dáta',1);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';let k=0;
 Object.entries(g).forEach(([id,ls])=>{const s='\ufeff'+[AH,...archRows(ls)].map(r=>r.map(q).join(';')).join('\r\n');setTimeout(()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download=`${slug(user(id).name)}_${S.af}_${S.at}.csv`;a.click()},400*k++)})}
function archPrint(){const g=byDrv();printHTML(Object.entries(g).map(([id,ls])=>`<div class="pslip"><div class="ph"><b><img src="logo.svg" style="height:34px;vertical-align:middle;margin-right:6px">PAL-KOV &amp; A.H.METAL</b><span>${esc(user(id).name)}</span></div><p>Obdobie ${fmtD(S.af)} – ${fmtD(S.at)} · ${ls.length} lístkov</p><table><tr>${AH.filter((_,i)=>i!==1).map(h=>`<th>${h}</th>`).join('')}</tr>${archRows(ls).map(r=>`<tr>${r.filter((_,i)=>i!==1).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join(''))}

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)afterLogin(session.user.id,S.view);else go('login')})();
</script></body></html>
